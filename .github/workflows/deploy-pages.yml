name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/premium-tattoo-landing-eqn0fd]
  workflow_dispatch:

# Publishing happens by pushing the built site to the `gh-pages` branch, which
# needs nothing beyond write access to the repository. The alternative — the
# actions/deploy-pages route — additionally requires permission to create the
# Pages site itself, which the default GITHUB_TOKEN does not have.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          # Project pages are served from /<repo>/, never the domain root.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pages runs Jekyll by default, which drops directories starting with
          # an underscore — and that is where Next puts every asset (_next/).
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
